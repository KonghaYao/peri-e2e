name: Record #449 P01 (temporary)

# 临时录制 job：回放基线是 Ubuntu，P01 cassette 只能在 ubuntu-24.04 上生成。
# 使用 push 触发是因为 workflow_dispatch 要求 workflow 先存在于默认分支。
# 录制产物经 artifact 取回并提交；本文件随后删除，不进入 PR 最终 diff。

on:
  push:
    branches: [test/449-dynamic-plugin-e2e]

permissions:
  contents: read

jobs:
  record:
    name: Record P01 replay fixture (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # run-replay-v2.mjs 与 runReplayScenario 都拒绝在 CI 环境录制，这里显式覆盖。
      CI: "false"
    steps:
      - name: Checkout peri-e2e
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve pinned Peri revision
        id: peri
        run: |
          rev="$(cat .github/peri-rev)"
          rev="${rev//[$'\r\n ']/}"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid Peri pin: '$rev'" >&2
            exit 1
          fi
          echo "sha=$rev" >> "$GITHUB_OUTPUT"

      - name: Checkout Peri at pinned revision
        uses: actions/checkout@v4
        with:
          repository: KonghaYao/peri
          ref: ${{ steps.peri.outputs.sha }}
          path: peri-src
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: peri-src -> target
          key: e2e-record
          save-if: false

      - name: Build pinned peri binary
        working-directory: peri-src
        run: ./scripts/cargo-rmcp-patched.sh build --locked -p peri-tui --bin peri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install peri-e2e dependencies
        run: npm ci

      - name: Record P01 only
        env:
          PERI_BINARY: ${{ github.workspace }}/peri-src/target/debug/peri
        run: npm run e2e:replay:record -- -t P01

      - name: Upload recorded fixture
        uses: actions/upload-artifact@v4
        with:
          name: p01-recorded-fixture
          path: |
            fixtures/replay-v2/P01
            fixtures/replay-v2/world
          retention-days: 7
          if-no-files-found: error

      - name: Upload record evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p01-record-results
          path: results/replay-v2
          retention-days: 7
          if-no-files-found: ignore
